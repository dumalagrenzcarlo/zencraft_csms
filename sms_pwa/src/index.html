<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Scanner</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CDN -->
    <link rel="stylesheet" href="assets/tailwind.css">
    <script defer src="renderer.js?v=1"></script>

</head>

<body class="bg-gray-100 h-screen flex flex-col font-sans p-6 overflow-hidden">
    <!-- Setup Modal -->
    <div id="setupModal" style="z-index: 100;"
        class="hidden fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
            <!-- Close Button -->
            <button id="closeModal" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 focus:outline-none">
                ✕
            </button>

            <h2 class="text-4xl font-bold mb-4 text-center">Setup</h2>
            <form id="setupForm" class="space-y-4">
                <!-- Website URL -->
                <div>
                    <label for="websiteUrl" class="block text-lg font-medium text-gray-700">Website URL</label>
                    <input type="text" id="websiteUrl" placeholder="https://example.com" required
                        class="mt-1 block w-full text-lg rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>

                <!-- Auth Code -->
                <div>
                    <label for="authCode" class="block text-lg font-medium text-gray-700">Auth Code</label>
                    <input type="text" id="authCode" placeholder="Enter your code" required
                        class="mt-1 block w-full text-lg rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>

                <!-- Submit Button -->
                <button type="submit" id="validateBtn"
                    class="w-full bg-indigo-600 text-white py-3 px-4 text-lg rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center justify-center">
                    <span id="btnText">Validate</span>
                    <svg id="loadingSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                    </svg>
                </button>
            </form>

            <!-- Message -->
            <p id="setupMessage" class="mt-4 text-center text-lg"></p>
        </div>
    </div>

    <div id="mainPage" class="grid grid-cols-10 gap-6 flex-1 overflow-hidden">
        <!-- Left Column (30%) -->
        <div class="col-span-3 bg-white shadow-md rounded-lg p-6 flex flex-col justify-between items-center space-y-6 overflow-y-auto">
            <!-- <h1 class="text-5xl font-bold text-gray-800 text-center">Welcome to Jacobo Z Gonzales Memorial National High School</h1> -->
            <div class="w-72 h-72 rounded-lg bg-gray-200 flex items-center justify-center shadow">
                <span class="text-gray-500">School Logo</span>
            </div>
            <!-- Current Date & Time under avatar -->
            <div class="text-center">
                <p id="currentDate" class="text-3xl font-semibold text-gray-700">---</p>
                <p id="currentTime" class="text-5xl font-bold text-gray-900">---</p>
            </div>
            <p class="text-gray-500 text-lg text-center">Scan ID to record attendance</p>
        </div>

        <!-- Right Column (70%) -->
        <div class="col-span-7 flex flex-col space-y-6 overflow-y-auto">

            <!-- Student Info + Status in one row -->
            <section class="bg-white shadow-md rounded-lg p-6 flex-shrink-0">
                <!-- Student Info -->
                <div class="flex justify-between items-center">
                    <h2  class="text-5xl font-semibold text-gray-700 mb-3 flex items-center justify-between">
                        Student Information
                    </h2>

                    <!-- Settings Cog Icon inside student section -->
                    <button id="settingsBtn" class="ml-4 p-2 rounded-full hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="h-6 w-6 text-gray-700"></svg>
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>
                <div class="mt-2 flex justify-between">
                    <div class="flex justify-start">
                        <div class="w-52 h-52 rounded-lg bg-gray-200 flex items-center justify-center shadow">
                            <span class="text-gray-500">Avatar</span>
                        </div>
                        <div class="ms-5 grid items-center">
                            <p class="text-3xl text-gray-600 mb-2"><strong>LRN:</strong> <span id="lrn">---</span></p>
                            <p class="text-3xl text-gray-600 mb-2"><strong>Name:</strong> <span id="studentName">---</span></p>
                            <p class="text-3xl text-gray-600"><strong>Timestamp:</strong> <span id="timestamp">---</span></p>

                        </div>

                    </div>
                    <!-- Status -->
                    <div class="flex items-center space-x-4">
                        <!-- Recorded -->
                        <svg id="status-recorded" xmlns="http://www.w3.org/2000/svg"
                            class="h-52 w-52 rounded-full border-2 border-green-500 text-green-500" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>  
                </div>
            </section>

            <!-- Logs Section -->
            <section class="bg-white shadow-md rounded-lg p-6 flex-1 overflow-hidden flex flex-col">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4 flex-shrink-0">Logs</h2>
                <div class="overflow-x-auto flex-1 min-h-0">
                    <div class="max-h-full overflow-y-auto border border-gray-200 rounded">
                        <table class="min-w-full text-base text-gray-700">
                            <thead class="bg-gray-100 sticky top-0">
                                <tr>
                                    <th class="px-4 py-3 text-left font-semibold">LRN</th>
                                    <th class="px-4 py-3 text-left font-semibold">Name</th>
                                    <th class="px-4 py-3 text-left font-semibold">Status</th>
                                    <th class="px-4 py-3 text-left font-semibold">Timestamp</th>
                                </tr>
                            </thead>
                            <tbody id="logsTable">
                                <!-- Log rows will be appended here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>


        </div>
    </div>

    <script>
        function updateStudentInfo(lrn, name, status = "Recorded") {
            // Masked display
            document.getElementById('lrn').textContent = maskLRN(lrn);
            document.getElementById('studentName').textContent = maskName(name);
            document.getElementById('timestamp').textContent = new Date().toLocaleString();


            // Add masked log entry
            const logsTable = document.getElementById('logsTable');
            const row = document.createElement('tr');

            let statusClass = "text-gray-600";
            if (status === "Recorded") statusClass = "text-green-600 font-semibold";
            else if (status === "Error") statusClass = "text-red-600 font-semibold";
            else if (status === "Not Found") statusClass = "text-gray-500 italic";

            row.innerHTML = `
                <td class="px-4 py-3 border-t">${maskLRN(lrn)}</td>
                <td class="px-4 py-3 border-t">${maskName(name)}</td>
                <td class="px-4 py-3 border-t"><span class="${statusClass}">${status}</span></td>
                <td class="px-4 py-3 border-t">${new Date().toLocaleString()}</td>
            `;
            logsTable.prepend(row);
        }

        // Example usage
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Recorded");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Error");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Recorded");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Not Found");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Recorded");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Recorded");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Recorded");
        updateStudentInfo("1234567890", "Juan Dela Cruz", "Recorded");

        // Current Date/Time updater (under avatar)
        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toDateString();   // e.g. "Sun Dec 7 2025"
            document.getElementById('currentTime').textContent = now.toLocaleTimeString(); // e.g. "2:47:05 PM"
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Settings modal toggle
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('setupModal');
        const closeModal = document.getElementById('closeModal');

        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
        });
        closeModal.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        // Mask LRN: keep last 3 digits visible
        function maskLRN(lrn) {
            if (!lrn) return "";
            const visible = lrn.slice(-3);
            return "*".repeat(lrn.length - 3) + visible;
        }

        // Mask Name: keep first letter of each word visible
        function maskName(name) {
            if (!name) return "";
            return name.split(" ").map(word => {
                if (word.length === 0) return "";
                return word[0] + "*".repeat(word.length - 1);
            }).join(" ");
        }
    </script>
</body>

</html>
